services:
  php:
    image: php:8.3-apache
    container_name: nexus-ledger-php
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - mysql
    command: >
      bash -c "docker-php-ext-install pdo pdo_mysql &&
      apache2-foreground"

  mysql:
    image: mysql:8.4
    container_name: nexus-ledger-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: nexus_ledger
    ports:
      - "3306:3306"
    volumes:
      - nexus_mysql_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d

volumes:
  nexus_mysql_data: